[workspace]
resolver = "2"
members = [
    "crates/seoul-terminal",
    "crates/seoul-daemon",
    "crates/seoul-vt",
    "crates/seoul-terminal-proto",
    "crates/seoul-workspace",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0"
authors = ["Seongmin Park <seompark@butbeautifulco.com>"]
repository = "https://github.com/butbeautifulco/seoul-terminal"

[workspace.dependencies]
anyhow = "1"
portable-pty = "0.9"
libghostty-vt = { git = "https://github.com/Uzaaft/libghostty-rs" }
gpui = "0.2.2"
futures = "0.3"
smol = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
unicode-width = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "6"
tokio = { version = "1", features = ["full"] }
rmp-serde = "1"
rand = "0.8"
bytes = { version = "1", features = ["serde"] }
libc = "0.2"
rust-embed = "8"
ropey = "1"
tree-sitter = "0.26"
tree-sitter-language = "0.1"
tree-sitter-rust = "0.24"
tree-sitter-javascript = "0.23"
tree-sitter-json = "0.24"
tree-sitter-toml-ng = "0.7"
tree-sitter-python = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-go = "0.25"
tree-sitter-css = "0.25"
tree-sitter-html = "0.23"
tree-sitter-bash = "0.25"
tree-sitter-yaml = "0.7"
tree-sitter-md = "0.5"
tree-sitter-ruby = "0.23"
tree-sitter-java = "0.23"
tree-sitter-swift = "0.7"
tree-sitter-php = "0.24"
tree-sitter-lua = "0.5"
tree-sitter-scala = "0.25"
tree-sitter-haskell = "0.23"
tree-sitter-elixir = "0.3"
tree-sitter-zig = "1.1"
tree-sitter-r = "1.2"
tree-sitter-dart = "0.1"
tree-sitter-ocaml = "0.24"
tree-sitter-c-sharp = "0.23"
tree-sitter-kotlin = "0.3"  # C source only — Rust bindings incompatible, built via build.rs
smallvec = "1"
streaming-iterator = "0.1"
unicode-segmentation = "1"
octocrab = "0.42"
async-channel = "2"
async-trait = "0.1"
urlencoding = "2"

[profile.dev]
split-debuginfo = "unpacked"
incremental = true

[profile.dev.build-override]
split-debuginfo = "unpacked"

[profile.dev.package]
gpui_macros = { opt-level = 2 }
quote = { opt-level = 2 }
syn = { opt-level = 2 }
proc-macro2 = { opt-level = 2 }

[profile.release]
debug = "limited"
lto = "thin"
codegen-units = 1

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
redundant_clone = "deny"

[patch.crates-io]
gpui = { git = "https://github.com/zed-industries/zed" }
